services:
  - type: web
    name: is-kanunu-rag
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: is_kanunu
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: RETRIEVER_K
        value: "3"
      - key: PYTHON_VERSION
        value: 3.11.9
